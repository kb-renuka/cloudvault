x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg2://cloudvault:cloudvault@db:5432/cloudvault
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: cloudvault
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault
      POSTGRES_DB: cloudvault
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A app.celery_app worker --loglevel=info

  beat:
    <<: *app
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  pgdata:
  miniodata:
